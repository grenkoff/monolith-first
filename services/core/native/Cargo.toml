[package]
name = "ranking"
version = "0.1.0"
description = "Ranks names by their resemblance to a query, as a Python extension module of core"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "ranking"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }

[workspace]

[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
unused_must_use = "deny"
missing_docs = "deny"
unexpected_cfgs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mutex_atomic = "deny"
too_many_lines = "deny"
missing_docs_in_private_items = "deny"
