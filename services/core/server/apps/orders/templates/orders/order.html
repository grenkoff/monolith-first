{% extends "layout/base.html" %}
{% block title %}Order{% endblock title %}
{% block content %}
  <h1 class="mb-4 text-3xl font-bold">Order placed</h1>
  <p>Quantity: {{ order.quantity }}</p>
  <p class="mb-6 text-xl">Total: {{ total }}</p>
  <a
    href="{% url 'catalog:product' identifier=order.product %}"
    class="underline"
  >Back to the product</a>
{% endblock content %}
