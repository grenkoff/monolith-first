{% extends "layout/base.html" %}
{% block title %}Order{% endblock title %}
{% block content %}
  <h1 class="ds-heading mb-4">Order placed</h1>
  <div class="ds-card mb-6 max-w-md">
    <p class="ds-muted">Quantity: {{ order.quantity }}</p>
    <p class="ds-price">Total: {{ total }}</p>
  </div>
  <a
    href="{% url 'catalog:product' identifier=order.product %}"
    class="ds-link"
  >Back to the product</a>
{% endblock content %}
