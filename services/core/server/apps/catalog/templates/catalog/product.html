{% extends "layout/base.html" %}
{% block title %}{{ product.name }}{% endblock title %}
{% block content %}
  <h1 class="mb-2 text-3xl font-bold">{{ product.name }}</h1>
  <p class="mb-6 text-xl text-gray-600">{{ price }}</p>
  <form method="post" action="/orders/" class="flex items-end gap-4">
    {% csrf_token %}
    <input type="hidden" name="product" value="{{ product.id }}">
    <label class="flex flex-col gap-1">
      <span>Quantity</span>
      <input
        type="number"
        name="quantity"
        value="1"
        min="1"
        required
        class="w-24 rounded border border-gray-300 px-3 py-2"
      >
    </label>
    <button
      type="submit"
      class="rounded bg-gray-900 px-4 py-2 font-medium text-white"
    >
      Order
    </button>
  </form>
{% endblock content %}
