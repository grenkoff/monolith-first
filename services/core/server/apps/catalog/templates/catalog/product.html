{% extends "layout/base.html" %}
{% block title %}{{ product.name }}{% endblock title %}
{% block content %}
  <h1 class="ds-heading mb-2">{{ product.name }}</h1>
  <p class="ds-price mb-6">{{ price }}</p>
  <form
    method="post"
    action="{% url 'orders:place' %}"
    class="ds-card flex max-w-md items-end gap-4"
  >
    {% csrf_token %}
    <input type="hidden" name="product" value="{{ product.id }}">
    <label class="ds-field">
      <span>Quantity</span>
      <input
        type="number"
        name="quantity"
        value="1"
        min="1"
        required
        class="ds-input w-24"
      >
    </label>
    <button type="submit" class="ds-button">Order</button>
  </form>
{% endblock content %}
