{% extends "layout/base.html" %}
{% block content %}
  <h1 class="ds-heading mb-6">Products</h1>
  {% if products %}
    <ul class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      {% for product, price in products %}
        <li class="ds-card">
          <a
            href="{% url 'catalog:product' identifier=product.id %}"
            class="ds-link text-lg font-medium"
          >{{ product.name }}</a>
          <p class="ds-price mt-2">{{ price }}</p>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="ds-muted">Nothing is on sale yet.</p>
  {% endif %}
{% endblock content %}
