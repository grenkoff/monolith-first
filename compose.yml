
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-core: &core
  image: "core:dev"
  build:
    context: ./services/core
    dockerfile: ./docker/django/Dockerfile
    target: development_build
    args:
      DJANGO_ENV: development
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  logging: *logging
  volumes:
    - ./services/core:/code
  env_file: ./services/core/config/.env
  environment:
    DJANGO_DATABASE_HOST: db
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: "postgres:18-alpine"
    restart: unless-stopped
    logging: *logging
    env_file: ./services/core/config/.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 30s
      retries: 5

  core-migrate:
    <<: *core
    command: python manage.py migrate --no-input

  core:
    <<: *core
    command: python -We -bb manage.py runserver 0.0.0.0:8000
    depends_on:
      core-migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: /bin/sh /code/docker/django/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  core-relay:
    <<: *core
    command: python manage.py relay_events
    restart: unless-stopped
    depends_on:
      core-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
